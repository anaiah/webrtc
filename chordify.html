<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Chordify by Caloy&orig;</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  
    <script>
        let aKey = []

        let aKeyOfC = ['C','D','E','F','G','A','B','C2','D2','E2','F2','G2','A2','B2','C3','D3','E3','F3','G3','A3','B3','C4']
        let aKeyOfD = ['D','E','F#','G','A','B','C#','D2','E2','F#2','G2','A2','B2','C#2','D3','E3','F#3','G3','A3','B3','C#3','D4']
        let aKeyOfE = ['E','F#','G#','A','B','C#','D#','E2','F#2','G#2','A2','B2','C#2','D#2','E3','F#3','G#3','A3','B3','C#3','D#3','E4']
        let aKeyOfF = ['F','G','A','Bb','C','D','E','F2','G2','A2','Bb2','C2','D2','E2','F3','G3','A3','Bb3','C3','D3','E3','F4']
        let aKeyOfG = ['G','A','B','C','D','E','F#','G2','A2','B2','C2','D2','E2','F#2','G3','A3','B3','C3','D3','E3','F#3','G4']
        let aKeyOfA = ['A','B','C#','D','E','F#','G#','A2','B2','C#2','D2','E2','F#2','G#2','A3','B3','C#3','D3','E3','F#3','G#3','A4']
        let aKeyOfB = ['B','C#','D#','E','F#','G#','A#','B2','C#2','D#2','E2','F#2','G#2','A#2','B3','C#3','D#3','E3','F#3','G#3','A#3','B4']

        let a3rd = [], a5th = []
        
        
        getkey =(xkey)=>{
            aKey = eval(xkey)
            document.getElementById('chordkey').innerHTML = aKey
            console.log( aKey )

            a3rd=[]
            a5th=[]

        }//

        findChord = (chords) =>{
            
            let aFind = chords.split(',')

            console.log( 'afind', aFind )

            let pos, xpos, c3rd = "", c5th = "" 
        
            let rootChord = document.getElementById('chord').value
            
            let triad = []
            pos = aKey.indexOf(rootChord)
            
            triad.push( aKey[pos] )
            triad.push( aKey[pos+2] )
            triad.push( aKey[pos+4] )
            
            console.log( 'TRIAD ', triad)
            
            aFind.forEach( (melody) => {

                xpos = triad.indexOf(melody)
                console.log(melody, 'pos is ', xpos)

                if(xpos==-1){
                    xpos = aKey.indexOf(melody)
                    c3rd = aKey[xpos-2]
                    c5th = aKey[xpos+3]
                }

                if(xpos==0){
                    c3rd = triad[xpos+1]
                    c5th = triad[xpos+2]
                }
                if(xpos == 1){
                    c3rd = triad[xpos+1]
                    c5th = triad[xpos-1]
                }

                if(xpos == 2){
                    c3rd = triad[xpos-2]
                    c5th = triad[xpos-1]
                }

                a3rd.push( c3rd )    
                a5th.push( c5th ) 

            })//end foreach
            
            document.getElementById('3rd').value = a3rd
            document.getElementById('5th').value = a5th

            console.log('3RD', a3rd )
            console.log('4TH', a5th ) 
            a3rd=[]
            a5th=[]
        }//
    
    </script>
</head>
<body>
    <strong>BETA STAGE... use with caution :D<br></strong>
    <form id="chordfrm" name="chordfrm" class="needs-validation">
     <div class="container">
        <div class="row mb-1 mt-5">
            <div class="col-6">
                <select id="xkey" name="xkey" onchange="javascript:getkey(this.value)" class="form-control">
                    <option selected value="">--PLS SELECT KEY--</option>        
                    <option value="aKeyOfC"> Key of C</option>
                    <option value="aKeyOfD"> Key of D</option>
                    <option value="aKeyOfE"> Key of E</option>
                    <option value="aKeyOfF"> Key of F</option>
                    <option value="aKeyOfG"> Key of G</option>
                    <option value="aKeyOfA"> Key of A</option>
                    <option value="aKeyOfB"> Key of B</option>
                </select> 
            </div>
        </div>
        <div class="row mb-2">
            <div class="col">
                <div class="mt-2 " id="chordkey" name="chordkey"></div>
            </div>
            
        </div>
        <div class="row mb-2">
            <div class="col-3">
                <label>Chord:</label>
                <input  class="form-control" id='chord' name='chord' type="text">
            </div>
            
        </div>
        <div class="row">
            <div class="col-sm6 mb-2">
                <input  class="form-control" id='chords' name='chords' type="text">
                <button type="button" class="btn btn-primary mt-2" onclick="javascript:findChord(document.getElementById('chords').value)">Find</button>
            </div>
        </div>

        <div class="row">
            <div class="col-sm6 mb-2">3rd:<br>
                <!--//3RD-->
                <input  class="form-control" id='3rd' name='3rd' type="text">
            </div>
        </div>

        <div class="row">
            <div class="col-sm6 mb-2">5th:<br>
                <!--//5th-->
                <input  class="form-control" id='5th' name='5th' type="text">
            </div>
        </div>

     </div>         
    
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
 
</body>
</html>
